{% extends "base.html" %}{% block title %}Home planner | PocketSmart AI{% endblock %}
{% block content %}<section class="form-page"><div class="page-intro"><p class="eyebrow">01 / HOME INTERIOR</p><h1>Make a home plan.</h1><p>Start with the space, then tell us what needs to fit.</p></div><form class="form-panel planner-form" method="post" action="/generate-home" data-loading-form>
{% if error %}<p class="alert alert-error">{{ error }}</p>{% endif %}<div class="field-grid"><label>Total budget<input type="number" name="total_budget" min="0.01" step="0.01" required placeholder="e.g. 75000"></label><label>Home or room type<input name="home_type" required maxlength="80" placeholder="Apartment, living room..."></label><label>Number of rooms<input type="number" name="room_count" min="1" max="100" required value="1"></label><label>Style preference<select name="style_preference" required><option value="">Choose a style</option><option>Modern</option><option>Minimal</option><option>Scandinavian</option><option>Traditional</option><option>Contemporary</option><option>Eclectic</option></select></label></div>
<label>Room details<textarea name="room_details" rows="3" maxlength="1000" required placeholder="Room size, light, current furniture..."></textarea></label><label>Items and quantities <small>One per line, formatted like Sofa: 1</small><textarea name="required_items" rows="5" maxlength="2500" required placeholder="Sofa: 1&#10;Lights: 2&#10;Curtains: 2"></textarea></label><div class="form-actions"><button class="button" type="submit">Build my home plan</button><span class="loading-note" aria-live="polite">Putting your plan together…</span></div></form></section>{% endblock %}
