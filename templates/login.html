{% extends "base.html" %}{% block title %}Log in | PocketSmart AI{% endblock %}
{% block content %}<section class="auth-layout"><div class="auth-aside"><p class="eyebrow">WELCOME BACK</p><h1>Your plans,<br><em>all in one place.</em></h1><p>Pick up where you left off and keep your budget in view.</p></div><form class="form-panel auth-form" method="post" action="/login"><h2>Log in</h2>{% if error %}<p class="alert alert-error">{{ error }}</p>{% endif %}<label>Email address<input type="email" name="email" autocomplete="email" required maxlength="254"></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="button" type="submit">Log in</button><p class="form-foot">New here? <a href="/register">Create an account</a></p></form></section>{% endblock %}
